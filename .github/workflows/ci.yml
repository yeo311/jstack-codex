name: jstack 검증
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    name: 스키마와 개인 상태 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
